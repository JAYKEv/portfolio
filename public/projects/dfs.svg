<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dfsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#141e33" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dfsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#dfsBg)" />

  <!-- Distributed Mesh Network Grid & Nodes -->
  <!-- Connecting Lines -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,4">
    <line x1="220" y1="160" x2="400" y2="110" />
    <line x1="400" y1="110" x2="580" y2="160" />
    <line x1="220" y1="160" x2="280" y2="310" />
    <line x1="580" y1="160" x2="520" y2="310" />
    <line x1="280" y1="310" x2="520" y2="310" />
    <line x1="400" y1="110" x2="400" y2="230" />
    <line x1="220" y1="160" x2="400" y2="230" />
    <line x1="580" y1="160" x2="400" y2="230" />
    <line x1="280" y1="310" x2="400" y2="230" />
    <line x1="520" y1="310" x2="400" y2="230" />
  </g>

  <!-- Central Coordinator Node -->
  <circle cx="400" cy="230" r="46" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#dfsGlow)" />
  <circle cx="400" cy="230" r="28" fill="#0284c7" opacity="0.8" />
  <text x="400" y="234" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">PRIMARY</text>
  <text x="400" y="246" fill="#bae6fd" font-family="monospace" font-size="8" text-anchor="middle">REPLICA</text>

  <!-- Node 1 (Master / Inode Coordinator) -->
  <circle cx="400" cy="110" r="32" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
  <text x="400" y="113" fill="#818cf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">NODE 01</text>
  <text x="400" y="125" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">Sockets: C</text>

  <!-- Node 2 (Storage Chunk A) -->
  <circle cx="220" cy="160" r="30" fill="#1e293b" stroke="#34d399" stroke-width="2" />
  <text x="220" y="163" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">CHUNK 01</text>
  <text x="220" y="174" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">Synced</text>

  <!-- Node 3 (Storage Chunk B) -->
  <circle cx="580" cy="160" r="30" fill="#1e293b" stroke="#34d399" stroke-width="2" />
  <text x="580" y="163" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">CHUNK 02</text>
  <text x="580" y="174" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">Synced</text>

  <!-- Node 4 (Lock Manager) -->
  <circle cx="280" cy="310" r="28" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
  <text x="280" y="313" fill="#f59e0b" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">MUTEX</text>
  <text x="280" y="324" fill="#94a3b8" font-family="monospace" font-size="7" text-anchor="middle">Lock Safe</text>

  <!-- Node 5 (Fault Tolerant Backup) -->
  <circle cx="520" cy="310" r="28" fill="#1e293b" stroke="#a855f7" stroke-width="2" />
  <text x="520" y="313" fill="#a855f7" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">BACKUP</text>
  <text x="520" y="324" fill="#94a3b8" font-family="monospace" font-size="7" text-anchor="middle">Auto-Failover</text>

  <!-- Terminal inspection overlay -->
  <rect x="50" y="360" width="700" height="60" rx="8" fill="#090d16" stroke="#334155" stroke-width="1" />
  <text x="70" y="382" fill="#34d399" font-family="monospace" font-size="11">$ ./dfs_cluster --nodes=5 --heartbeat=20ms --quorum=strict</text>
  <text x="70" y="402" fill="#94a3b8" font-family="monospace" font-size="11">[DFS_CORE] Cluster healthy. 0 packets dropped. Replication quorum verified across all nodes.</text>
</svg>
