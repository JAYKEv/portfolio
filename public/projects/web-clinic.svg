<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="clinicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426" />
      <stop offset="50%" stop-color="#0f233f" />
      <stop offset="100%" stop-color="#07101e" />
    </linearGradient>
    <linearGradient id="clinicAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#clinicBg)" />

  <!-- Grid Pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Metric Panels -->
  <!-- Panel 1: Throughput -->
  <rect x="80" y="70" width="190" height="130" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
  <text x="100" y="102" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">CONCURRENT REQS</text>
  <text x="100" y="145" fill="#38bdf8" font-family="sans-serif" font-size="34" font-weight="bold">1000+</text>
  <text x="100" y="172" fill="#34d399" font-family="monospace" font-size="11">▲ sub-200ms response</text>

  <!-- Panel 2: Database Latency -->
  <rect x="300" y="70" width="190" height="130" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <text x="320" y="102" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">MONGODB SPEED</text>
  <text x="320" y="145" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="bold">+45%</text>
  <text x="320" y="172" fill="#06b6d4" font-family="monospace" font-size="11">Query Plan Indexed</text>

  <!-- Panel 3: Uptime / SLA -->
  <rect x="520" y="70" width="190" height="130" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <text x="540" y="102" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">API AVAILABILITY</text>
  <text x="540" y="145" fill="#34d399" font-family="sans-serif" font-size="34" font-weight="bold">99.9%</text>
  <text x="540" y="172" fill="#94a3b8" font-family="monospace" font-size="11">Zero-downtime REST</text>

  <!-- Simulated Real-time Telemetry Graph -->
  <rect x="80" y="225" width="630" height="165" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />
  <text x="105" y="255" fill="#cbd5e1" font-family="monospace" font-size="12">API Throughput &amp; Query Latency Telemetry</text>
  
  <!-- Graph Wave -->
  <path d="M 105 345 Q 160 320 220 335 T 340 290 T 450 310 T 570 270 T 685 285" fill="none" stroke="#06b6d4" stroke-width="3" />
  <path d="M 105 345 Q 160 320 220 335 T 340 290 T 450 310 T 570 270 T 685 285 L 685 365 L 105 365 Z" fill="#06b6d4" opacity="0.1" />

  <!-- Data points -->
  <circle cx="340" cy="290" r="5" fill="#38bdf8" />
  <circle cx="570" cy="270" r="5" fill="#38bdf8" />
</svg>
