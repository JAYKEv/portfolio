<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#111c38" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="800" height="450" rx="16" fill="url(#bgGrad1)" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="0.75" opacity="0.3">
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="250" y1="0" x2="250" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="550" y1="0" x2="550" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
  </g>

  <!-- Ambient Glow Center -->
  <circle cx="400" cy="225" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow1)" />
  <circle cx="520" cy="180" r="110" fill="#818cf8" opacity="0.1" filter="url(#glow1)" />

  <!-- Code / Real-time Collaboration Mockup Interface -->
  <rect x="140" y="75" width="520" height="300" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  
  <!-- Editor Header -->
  <rect x="140" y="75" width="520" height="38" rx="12" fill="#1e293b" />
  <circle cx="165" cy="94" r="5" fill="#ef4444" />
  <circle cx="182" cy="94" r="5" fill="#f59e0b" />
  <circle cx="199" cy="94" r="5" fill="#10b981" />
  <text x="400" y="99" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle" font-weight="500">Clade // Multi-User Sync Editor (Socket.io)</text>

  <!-- Left Sidebar -->
  <rect x="140" y="113" width="130" height="262" fill="#090d16" opacity="0.8" />
  <rect x="155" y="130" width="80" height="8" rx="3" fill="#38bdf8" opacity="0.6" />
  <rect x="155" y="150" width="100" height="6" rx="3" fill="#64748b" opacity="0.4" />
  <rect x="155" y="165" width="90" height="6" rx="3" fill="#64748b" opacity="0.4" />
  <rect x="155" y="180" width="70" height="6" rx="3" fill="#64748b" opacity="0.4" />

  <!-- Real-time Connected Avatars -->
  <circle cx="170" cy="340" r="12" fill="#38bdf8" />
  <circle cx="190" cy="340" r="12" fill="#818cf8" />
  <circle cx="210" cy="340" r="12" fill="#34d399" />
  <text x="232" y="344" fill="#38bdf8" font-family="monospace" font-size="10">+100 online</text>

  <!-- Main Code Pane with live cursors -->
  <rect x="290" y="135" width="160" height="8" rx="3" fill="#38bdf8" opacity="0.8" />
  <rect x="310" y="155" width="220" height="8" rx="3" fill="#e2e8f0" opacity="0.7" />
  <rect x="310" y="175" width="180" height="8" rx="3" fill="#e2e8f0" opacity="0.5" />
  <rect x="330" y="195" width="140" height="8" rx="3" fill="#34d399" opacity="0.8" />
  <rect x="330" y="215" width="260" height="8" rx="3" fill="#e2e8f0" opacity="0.6" />
  <rect x="310" y="235" width="90" height="8" rx="3" fill="#818cf8" opacity="0.8" />

  <!-- Live Cursor 1 (Jaykumar) -->
  <line x1="455" y1="190" x2="455" y2="210" stroke="#38bdf8" stroke-width="2" />
  <rect x="455" y="172" width="70" height="16" rx="4" fill="#38bdf8" />
  <text x="490" y="184" fill="#090d16" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">JK (Dev)</text>

  <!-- Live Cursor 2 (Peer) -->
  <line x1="575" y1="210" x2="575" y2="230" stroke="#34d399" stroke-width="2" />
  <rect x="575" y="192" width="60" height="16" rx="4" fill="#34d399" />
  <text x="605" y="204" fill="#090d16" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">Peer #2</text>

  <!-- Metric overlay badge -->
  <rect x="490" y="280" width="150" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="565" y="298" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">sub-100ms Latency</text>
  <text x="565" y="313" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">100+ Concurrent Edits</text>
</svg>
